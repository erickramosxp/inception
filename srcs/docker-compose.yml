
services:
  db:
    build: ./mariadb
    container_name: mariadb-server
    env_file:
      - .env
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    restart: always

secrets:
   db_password:
     file: db_password.txt
   db_root_password:
     file: db_root_password.txt
