services:
  mariadb:
    build: ./requirements/mariadb
    image: mariadb:inception
    container_name: mariadb
    pull_policy: build
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u${WORDPRESS_DB_USER} -p${WORDPRESS_DB_PASSWORD}"]
      interval: 30s
      timeout: 10s
      retries: 3
    env_file:
      - .env
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    networks:
      - wpnet
    restart: on-failure
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    build: ./requirements/wordpress     # Dockerfile dentro da pasta wordpress
    image: wordpress:inception
    container_name: wordpress
    pull_policy: build
    healthcheck:
      test: ["CMD", "wp", "core", "is-installed"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      WORDPRESS_DB_HOST: ${WORDPRESS_DB_HOST}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
      WORDPRESS_URL: ${SERVER_NAME}
      WORDPRESS_ADMIN_USER: ${WORDPRESS_ADMIN_USER}
      WORDPRESS_ADMIN_PASSWORD: ${WORDPRESS_ADMIN_PASSWORD}
      WORDPRESS_ADMIN_EMAIL: ${WORDPRESS_ADMIN_EMAIL}
      WORDPRESS_USER: ${WORDPRESS_USER}
      WORDPRESS_PASSWORD: ${WORDPRESS_PASSWORD}
      WORDPRESS_EMAIL: ${WORDPRESS_EMAIL}
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - wpnet
    restart: on-failure
    volumes:
      - wp_data:/var/www/html

  nginx:
    build: ./requirements/nginx
    image: nginx:inception
    container_name: nginx
    pull_policy: build
    depends_on:
      wordpress:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "443"]
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - "443:443"
    environment:
      SERVER_NAME: ${SERVER_NAME}
    networks:
      - wpnet
    restart: on-failure
    volumes:
      - wp_data:/var/www/html

networks:
  wpnet:
    driver: bridge

volumes:
  db_data:
    driver: local # Or your specific driver
    driver_opts: # Correct indentation here
      o: bind
      type: none
      device: "/home/erramos/data/db_data"

  wp_data:
    driver: local # Or your specific driver
    driver_opts: # Correct indentation here
      o: bind
      type: none
      device: "/home/erramos/data/wp_data"


secrets:
  db_password:
    file: db_password.txt
  db_root_password:
    file: db_root_password.txt
