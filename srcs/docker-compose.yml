services:
  mariadb:
    build: ./requirements/mariadb
    image: mariadb:inception
    container_name: mariadb
    env_file:
      - .env
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    networks:
      - wpnet
    restart: on-failure
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    build: ./requirements/wordpress     # Dockerfile dentro da pasta wordpress
    image: wordpress:inception
    container_name: wordpress
    environment:
      WORDPRESS_DB_HOST: ${WORDPRESS_DB_HOST}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
      WORDPRESS_URL: ${SERVER_NAME}
      WORDPRESS_ADMIN_USER: ${WORDPRESS_ADMIN_USER}
      WORDPRESS_ADMIN_PASSWORD: ${WORDPRESS_ADMIN_PASSWORD}
      WORDPRESS_ADMIN_EMAIL: ${WORDPRESS_ADMIN_EMAIL}
      WORDPRESS_USER: ${WORDPRESS_USER}
      WORDPRESS_PASSWORD: ${WORDPRESS_PASSWORD}
      WORDPRESS_EMAIL: ${WORDPRESS_EMAIL}
    depends_on:
      - mariadb
    networks:
      - wpnet
    restart: on-failure
    volumes:
      - wp_data:/var/www/html

  nginx:
    build: ./requirements/nginx
    image: nginx:inception
    container_name: nginx
    ports:
      - "443:443"
    environment:
      SERVER_NAME: ${SERVER_NAME}
    depends_on:
      - wordpress
    networks:
      - wpnet
    restart: on-failure
    volumes:
      - wp_data:/var/www/html

networks:
  wpnet:
    driver: bridge

volumes:
  db_data:
    driver: local # Or your specific driver
    driver_opts: # Correct indentation here
      o: bind
      type: none
      device: "/home/erramos/data/db_data"

  wp_data:
    driver: local # Or your specific driver
    driver_opts: # Correct indentation here
      o: bind
      type: none
      device: "/home/erramos/data/wp_data"


secrets:
  db_password:
    file: db_password.txt
  db_root_password:
    file: db_root_password.txt
